name: PR Template
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  add_pr_template_comment:
    name: Add PR Template Comment
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and add template comment
        uses: actions/github-script@v7
        with:
          script: |
            try {
              // Read the template file
              const fs = require('fs');
              const templateContent = fs.readFileSync('.github/pr_template.md', 'utf8');
              
              // Get all comments on the PR
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });
              
              // Check if template comment already exists
              const templateExists = comments.some(comment => {
                // Check if comment contains key phrases from your template
                return comment.body.includes('Make sure you go into all these steps before setting to "Ready to review"') ||
                       comment.body.includes('What is happening in the pull request in short summary?');
              });
              
              if (!templateExists) {
                console.log('Template comment not found, adding it now...');
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: templateContent
                });
                console.log('Template comment added successfully!');
              } else {
                console.log('Template comment already exists, skipping...');
              }
            } catch (error) {
              console.error('Error:', error);
              throw error;
            }
